<div>
    <h5>Ρυθμίσεις οδηγού προγράμματος (EPG)
        <button class="pull-right btn btn-sm btn-success" ng-click="updateSettings(settings)">Αποθήκευση</button>
    </h5>
    <p>Τα στοιχεία προέρχονται από τον Plex. Ο οδηγός υποστηρίζει έως 31 ημέρες, ενώ συνιστώνται 14 ημέρες (336 ώρες).</p>
    <div class="row">
        <div class="col-sm-6"><label>Διάρκεια οδηγού (ώρες)</label><input type="number" min="1" max="744" class="form-control form-control-sm" ng-model="settings.cache"/></div>
        <div class="col-sm-6"><label>Ενημέρωση (ώρες)</label><input type="number" min="1" max="48" class="form-control form-control-sm" ng-model="settings.refresh"/></div>
    </div>
    <details style="margin-top:15px"><summary>Προχωρημένα</summary><label>Αρχείο XMLTV</label><input type="text" class="form-control form-control-sm" ng-model="settings.file"/></details>
    <p style="margin-top:15px"><a href="/api/xmltv.xml">Λήψη XMLTV</a></p>
</div>
