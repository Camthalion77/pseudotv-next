name: PseudoTV Code Check

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find src -name '*.js' -exec node --check {} \;
          node --check index.js
