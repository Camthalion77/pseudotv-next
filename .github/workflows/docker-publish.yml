name: Publish PseudoTV Next (development)

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pseudotv-next-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Syntax checks
        run: |
          find src tests -name '*.js' -exec node --check {} \;
          node --check index.js
          node --check web/public/guide.js
      - name: Streaming and EPG tests
        run: node --test tests/*.test.js

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/camthalion77/pseudotv-next:development
            ghcr.io/camthalion77/pseudotv-next:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Camthalion77/pseudotv-next
            org.opencontainers.image.description=Direct Stream and EPG 2.0 test edition for TVHeadend
          cache-from: type=gha
          cache-to: type=gha,mode=max
