name: Publish PseudoTV Next (development and releases)

on:
  push:
    branches: [development]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pseudotv-next-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Syntax checks
        run: |
          find src tests -name '*.js' -exec node --check {} \;
          node --check index.js
      - name: Streaming and EPG tests
        run: node --test tests/*.test.js
      - name: Validate XMLTV structure using Python
        run: python3 tests/check_xmltv.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/camthalion77/pseudotv-next
          tags: |
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/development' }}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/development' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and publish (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Camthalion77/pseudotv-next
            org.opencontainers.image.description=PseudoTV Next Direct Stream with XMLTV guide
          cache-from: type=gha
          cache-to: type=gha,mode=max
